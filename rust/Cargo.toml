[workspace]
resolver = "3"
members = ["diffle"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "net", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
rustix = { version = "1", features = ["process", "system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", default-features = false, features = ["fs", "compression-gzip"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "warn"
