name: Rust benchmark

# Builds the Rust server at the PR's base and head, benchmarks both on this one runner
# (alternating, so drift hits both alike) and fails when the head got clearly slower, uses
# more memory or CPU, or started failing requests. See rust/bench/README.md.
on:
  pull_request:
    paths:
      - rust/**
      - .github/workflows/rust-bench.yml
  workflow_dispatch:
    inputs:
      base:
        description: Ref to compare the selected ref against
        default: main

concurrency:
  group: rust-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
      # The socket probe (wspush.mjs) uses the global WebSocket of Node 22+.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Is there a Rust server at the base to compare with?
        id: base
        run: |
          if [ -f base/rust/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::The base has no rust/ directory, so there is nothing to compare with."; fi
      - name: Test the verdict logic
        run: python3 -m unittest -v
        working-directory: head/rust/bench/regression
      - name: Install ApacheBench
        if: steps.base.outputs.present
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils
      - name: Build both servers
        if: steps.base.outputs.present
        run: |
          for side in base head; do
            (cd "$side/rust" && rustup toolchain install && cargo build --release --locked --bin diffle)
          done
      - name: Benchmark
        if: steps.base.outputs.present
        run: |
          python3 head/rust/bench/regression/run.py \
            --base base/rust/target/release/diffle \
            --head head/rust/target/release/diffle \
            --rounds 5 --out "$RUNNER_TEMP/bench" --summary "$GITHUB_STEP_SUMMARY"
      # The raw runs, to judge a failure by or to compare two runs of the pipeline.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.base.outputs.present
        with:
          name: rust-bench
          path: ${{ runner.temp }}/bench/*.json
